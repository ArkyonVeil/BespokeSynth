name: Build And Release

on:
  pull_request:
    types: [closed]
    branches:
      - songcanvas-main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-release:
    name: Release Existence Check
    runs-on: ubuntu-22.04
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Read tag from template
        id: read_tag
        run: |
          tag_line="$(sed -n '1p' RELEASE_TEMPLATE.md)"
          tag="${tag_line#Tag: }"
          if [ -z "$tag" ]; then
            echo "Could not read tag from RELEASE_TEMPLATE.md line 1"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Fail if release already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.read_tag.outputs.tag }}"
          if gh release view "$tag" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release '$tag' already exists. Aborting."
            exit 1
          fi
          echo "Release '$tag' does not exist. Proceeding."

  build:
    name: Build (${{ matrix.name }})
    needs: check-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-x64
            runner: macos-14
            platform: macos
            artifact_name: INSTALLER_MAC_NIGHTLY
          - name: windows-x64
            runner: windows-2025
            platform: windows
            artifact_name: INSTALLER_WIN_NIGHTLY
          - name: linux-x64
            runner: ubuntu-22.04
            platform: linux
            artifact_name: INSTALLER_LIN_NIGHTLY

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install ccache (Linux/macOS)
        if: matrix.platform != 'windows'
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            sudo apt-get update && sudo apt-get install -y ccache
          else
            brew install ccache
          fi

      - name: Install sccache (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: choco install sccache -y

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            ~/AppData/Local/Mozilla/sccache
          key: compiler-cache-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            compiler-cache-${{ matrix.name }}-

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
              devscripts \
              libxcb-cursor-dev \
              libxcb-keysyms1-dev \
              libxcb-util-dev \
              libxkbcommon-dev \
              libxkbcommon-x11-dev \
              ninja-build \
              xcb \
              libgtk-3-dev \
              libwebkit2gtk-4.0 \
              libwebkit2gtk-4.0-dev \
              libcurl4-openssl-dev \
              alsa \
              alsa-tools \
              libasound2-dev \
              libjack-dev \
              libfreetype6-dev \
              libxinerama-dev \
              libxcb-xinerama0 \
              libxinerama1 \
              x11proto-xinerama-dev \
              libxrandr-dev \
              libgl1-mesa-dev \
              libxcursor-dev \
              libxcursor1 \
              libxcb-cursor0 \
              libusb-1.0.0-dev \
              patchelf

      - name: Install macOS dependencies
        if: matrix.platform == 'macos'
        run: |
          set -e
          npm install -g appdmg
          wget https://www.python.org/ftp/python/3.10.0/python-3.10.0post2-macos11.pkg
          sudo installer -pkg python-3.10.0post2-macos11.pkg -target /

      - name: Download and extract ASIO SDK (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -e
          curl -L "https://www.steinberg.net/asiosdk" -o asiosdk.zip
          unzip -q asiosdk.zip -d asiosdk_extracted
          ASIO_H=$(find asiosdk_extracted -name 'asio.h' | head -1)
          ASIO_SDK_PATH=$(dirname "$ASIO_H")
          while [ ! -d "$ASIO_SDK_PATH/common" ] && [ "$ASIO_SDK_PATH" != "." ]; do
            ASIO_SDK_PATH=$(dirname "$ASIO_SDK_PATH")
          done
          echo "ASIO_SDK_PATH=$(pwd)/$ASIO_SDK_PATH" >> "$GITHUB_ENV"

      - name: Download and extract VST2 SDK (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -e
          curl -L "https://archive.org/download/VST2SDK/vstsdk2_4.zip" -o vst2sdk.zip
          unzip -q vst2sdk.zip -d vst2sdk_extracted
          AEFFECT_H=$(find vst2sdk_extracted -name 'aeffect.h' | head -1)
          VST2_SDK_PATH=$(dirname "$AEFFECT_H")
          while [ ! -d "$VST2_SDK_PATH/pluginterfaces" ] && [ "$VST2_SDK_PATH" != "." ]; do
            VST2_SDK_PATH=$(dirname "$VST2_SDK_PATH")
          done
          echo "VST2_SDK_PATH=$(pwd)/$VST2_SDK_PATH" >> "$GITHUB_ENV"

      - name: Configure macOS build
        if: matrix.platform == 'macos'
        run: |
          set -e
          cmake -Bbuild \
            -GXcode \
            -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' \
            -DBESPOKE_PYTHON_ROOT='/Library/Frameworks/Python.framework/Versions/3.10' \
            -DCMAKE_BUILD_TYPE=Release \
            -DBESPOKE_PORTABLE=True \
            -DBESPOKE_NIGHTLY=True \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure Windows build
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -e
          cmake -Bbuild \
            -A x64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBESPOKE_PORTABLE=True \
            -DBESPOKE_NIGHTLY=True \
            -DBESPOKE_ASIO_SDK_LOCATION="${ASIO_SDK_PATH}" \
            -DBESPOKE_VST2_SDK_LOCATION="${VST2_SDK_PATH}" \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Configure Linux build
        if: matrix.platform == 'linux'
        run: |
          set -e
          cmake -Bbuild \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBESPOKE_PORTABLE=True \
            -DBESPOKE_NIGHTLY=True \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build nightly package
        shell: bash
        run: |
          set -e
          cmake --build build --config Release --target nightly-package

      - name: Package Windows artifact - copy
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -e
          rm -rf windows_nightly_artefact || true
          cp -R build/Source/BespokeSynth_artefacts/Release windows_nightly_artefact

      - name: Package Windows artifact - compress
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          mkdir build/nightly
          Compress-Archive -Path "windows_nightly_artefact/*" -DestinationPath "build/nightly/BespokeSynth-Windows.zip"

      - name: Package Linux artifact
        if: matrix.platform == 'linux'
        run: |
          set -e
          mkdir -p build/nightly
          tar -cvzf build/nightly/BespokeSynth-Linux.tar.gz build/Source/BespokeSynth_artefacts/Release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: build/nightly/
          if-no-files-found: error

  code-formatting:
    name: Code Formatting
    needs: check-release
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install Linux dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
              devscripts \
              libxcb-cursor-dev \
              libxcb-keysyms1-dev \
              libxcb-util-dev \
              libxkbcommon-dev \
              libxkbcommon-x11-dev \
              ninja-build \
              xcb \
              libgtk-3-dev \
              libwebkit2gtk-4.0 \
              libwebkit2gtk-4.0-dev \
              libcurl4-openssl-dev \
              alsa \
              alsa-tools \
              libasound2-dev \
              libjack-dev \
              libfreetype6-dev \
              libxinerama-dev \
              libxcb-xinerama0 \
              libxinerama1 \
              x11proto-xinerama-dev \
              libxrandr-dev \
              libgl1-mesa-dev \
              libxcursor-dev \
              libxcursor1 \
              libxcb-cursor0 \
              libusb-1.0.0-dev \
              patchelf

      - name: Configure formatting checks
        run: |
          set -e
          cmake -Bbuild \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBESPOKE_PORTABLE=True \
            -DBESPOKE_WERROR=True

      - name: Run formatting checks
        run: |
          set -e
          cmake --build build --config Debug --target code-quality-pipeline-checks

  release:
    name: Release
    runs-on: macos-14
    needs:
      - build
      - code-formatting

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Read release template
        id: release_template
        run: |
          set -euo pipefail
          template="RELEASE_TEMPLATE.md"
          tag_line="$(sed -n '1p' "$template")"
          title_line="$(sed -n '2p' "$template")"

          case "$tag_line" in
            "Tag: "*) ;;
            *)
              echo "RELEASE_TEMPLATE.md line 1 must start with 'Tag: '"
              exit 1
              ;;
          esac

          case "$title_line" in
            "Title: "*) ;;
            *)
              echo "RELEASE_TEMPLATE.md line 2 must start with 'Title: '"
              exit 1
              ;;
          esac

          tag="${tag_line#Tag: }"
          title="${title_line#Title: }"

          if [ -z "$tag" ] || [ -z "$title" ]; then
            echo "RELEASE_TEMPLATE.md tag and title must not be empty"
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "title=$title"
          } >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          set -euo pipefail
          short_hash="$(git rev-parse --short=7 HEAD)"

          mkdir -p releases
          find artifacts -type f \( -name '*.zip' -o -name '*.dmg' -o -name '*.gz' \) -exec cp {} releases/ \;

          shopt -s nullglob
          for f in releases/*.zip releases/*.dmg releases/*.gz; do
            ext="${f##*.}"
            base="${f%.*}"
            mv -- "$f" "${base}_${short_hash}_$(date +%F).${ext}"
          done

          image_url="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/RELEASE_IMAGE.png"
          {
            echo "![]($image_url)"
            echo ""
            tail -n +3 RELEASE_TEMPLATE.md
          } > releases/ReleaseNotes.md

          ls -alFh releases

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_template.outputs.tag }}
          name: ${{ steps.release_template.outputs.title }}
          target_commitish: ${{ github.sha }}
          body_path: releases/ReleaseNotes.md
          files: |
            releases/*.zip
            releases/*.dmg
            releases/*.gz
          draft: true
          prerelease: false
          overwrite_files: true
