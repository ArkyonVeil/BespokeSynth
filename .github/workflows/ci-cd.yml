name: Build And Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-x64
            runner: macos-14
            platform: macos
            artifact_name: INSTALLER_MAC_NIGHTLY
          - name: windows-x64
            runner: windows-2025
            platform: windows
            artifact_name: INSTALLER_WIN_NIGHTLY
          - name: linux-x64
            runner: ubuntu-22.04
            platform: linux
            artifact_name: INSTALLER_LIN_NIGHTLY

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 5
          submodules: recursive

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
              devscripts \
              libxcb-cursor-dev \
              libxcb-keysyms1-dev \
              libxcb-util-dev \
              libxkbcommon-dev \
              libxkbcommon-x11-dev \
              ninja-build \
              xcb \
              libgtk-3-dev \
              libwebkit2gtk-4.0 \
              libwebkit2gtk-4.0-dev \
              libcurl4-openssl-dev \
              alsa \
              alsa-tools \
              libasound2-dev \
              libjack-dev \
              libfreetype6-dev \
              libxinerama-dev \
              libxcb-xinerama0 \
              libxinerama1 \
              x11proto-xinerama-dev \
              libxrandr-dev \
              libgl1-mesa-dev \
              libxcursor-dev \
              libxcursor1 \
              libxcb-cursor0 \
              libusb-1.0.0-dev \
              patchelf

      - name: Install macOS dependencies
        if: matrix.platform == 'macos'
        run: |
          set -e
          brew install python@3.10
          npm install -g appdmg

      - name: Configure macOS build
        if: matrix.platform == 'macos'
        run: |
          set -e
          PYTHON_ROOT="$(brew --prefix python@3.10)"
          echo "Using Python root: $PYTHON_ROOT"
          cmake -Bbuild \
            -GXcode \
            -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' \
            -DBESPOKE_PYTHON_ROOT="$PYTHON_ROOT" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBESPOKE_PORTABLE=True \
            -DBESPOKE_NIGHTLY=True

      - name: Configure Windows build
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -e
          cmake -Bbuild \
            -A x64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBESPOKE_PORTABLE=True \
            -DBESPOKE_NIGHTLY=True

      - name: Configure Linux build
        if: matrix.platform == 'linux'
        run: |
          set -e
          cmake -Bbuild \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBESPOKE_PORTABLE=True \
            -DBESPOKE_NIGHTLY=True

      - name: Build nightly package
        shell: bash
        run: |
          set -e
          cmake --build build --config Release --target nightly-package

      - name: Package Windows artifact
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "build/nightly" -Force | Out-Null
          Remove-Item -LiteralPath "windows_nightly_artefact" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -LiteralPath "build/Source/BespokeSynth_artefacts/Release" -Destination "windows_nightly_artefact" -Recurse
          Remove-Item -LiteralPath "build/nightly/BespokeSynth-Windows.zip" -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "windows_nightly_artefact/*" -DestinationPath "build/nightly/BespokeSynth-Windows.zip"

      - name: Package Linux artifact
        if: matrix.platform == 'linux'
        run: |
          set -e
          mkdir -p build/nightly
          tar -cvzf build/nightly/BespokeSynth-Linux.tar.gz build/Source/BespokeSynth_artefacts/Release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: build/nightly/
          if-no-files-found: error

  code-formatting:
    name: Code Formatting
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 5
          submodules: recursive

      - name: Install Linux dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
              devscripts \
              libxcb-cursor-dev \
              libxcb-keysyms1-dev \
              libxcb-util-dev \
              libxkbcommon-dev \
              libxkbcommon-x11-dev \
              ninja-build \
              xcb \
              libgtk-3-dev \
              libwebkit2gtk-4.0 \
              libwebkit2gtk-4.0-dev \
              libcurl4-openssl-dev \
              alsa \
              alsa-tools \
              libasound2-dev \
              libjack-dev \
              libfreetype6-dev \
              libxinerama-dev \
              libxcb-xinerama0 \
              libxinerama1 \
              x11proto-xinerama-dev \
              libxrandr-dev \
              libgl1-mesa-dev \
              libxcursor-dev \
              libxcursor1 \
              libxcb-cursor0 \
              libusb-1.0.0-dev \
              patchelf

      - name: Configure formatting checks
        run: |
          set -e
          cmake -Bbuild \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBESPOKE_PORTABLE=True \
            -DBESPOKE_WERROR=True

      - name: Run formatting checks
        run: |
          set -e
          cmake --build build --config Debug --target code-quality-pipeline-checks

  release:
    name: Release
    runs-on: macos-14
    needs:
      - build
      - code-formatting

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Read release template
        id: release_template
        run: |
          set -euo pipefail
          template="RELEASE_TEMPLATE.md"
          tag_line="$(sed -n '1p' "$template")"
          title_line="$(sed -n '2p' "$template")"

          case "$tag_line" in
            "Tag: "*) ;;
            *)
              echo "RELEASE_TEMPLATE.md line 1 must start with 'Tag: '"
              exit 1
              ;;
          esac

          case "$title_line" in
            "Title: "*) ;;
            *)
              echo "RELEASE_TEMPLATE.md line 2 must start with 'Title: '"
              exit 1
              ;;
          esac

          tag="${tag_line#Tag: }"
          title="${title_line#Title: }"

          if [ -z "$tag" ] || [ -z "$title" ]; then
            echo "RELEASE_TEMPLATE.md tag and title must not be empty"
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "title=$title"
          } >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          set -euo pipefail
          short_hash="$(git rev-parse --short=7 HEAD)"

          mkdir -p releases
          find artifacts -type f \( -name '*.zip' -o -name '*.dmg' -o -name '*.gz' \) -exec cp {} releases/ \;

          shopt -s nullglob
          for f in releases/*.zip releases/*.dmg releases/*.gz; do
            ext="${f##*.}"
            base="${f%.*}"
            mv -- "$f" "${base}_${short_hash}_$(date +%F).${ext}"
          done

          printf '%s\n\n' "${{ steps.release_template.outputs.title }}" > releases/ReleaseNotes.md
          tail -n +4 RELEASE_TEMPLATE.md >> releases/ReleaseNotes.md
          printf '\n\n<pre>\n' >> releases/ReleaseNotes.md
          git log -5 --pretty=format:'%h : %s - %an' >> releases/ReleaseNotes.md
          printf '\n</pre>\n' >> releases/ReleaseNotes.md

          ls -alFh releases

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_template.outputs.tag }}
          name: ${{ steps.release_template.outputs.title }}
          target_commitish: ${{ github.sha }}
          body_path: releases/ReleaseNotes.md
          files: |
            releases/*.zip
            releases/*.dmg
            releases/*.gz
          draft: true
          prerelease: false
          overwrite_files: true
